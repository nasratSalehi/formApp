services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: formapp
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: evently
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U evently -d formapp" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/formapp
      SPRING_DATASOURCE_USERNAME: evently
      SPRING_DATASOURCE_PASSWORD: evently
    ports:
       - "8080:8080"

volumes:
  db-data:
